name: pharmacy_app
description: Student Pharma Centre - A pharmacy management mobile app with inventory, stock alerts, patient records, and staff login.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.1
  intl: ^0.18.1
  fl_chart: ^0.66.0
  crypto: ^3.0.3
  file_picker: ^10.3.0
  excel: ^4.0.6
  csv: ^6.0.0
  shared_preferences: ^2.2.2
  mailer: ^6.1.0
  sqflite_common_ffi: ^2.3.0+4
  sqlite3_flutter_libs: ^0.5.24

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
